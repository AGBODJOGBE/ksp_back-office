# Intégration continue de ksp_back-office.
# Toute demande de fusion vers main doit passer ces contrôles (protection de branche).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualité, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typage
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Navigateur des tests de bout en bout
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    name: Image Docker
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion au registre
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image de préproduction : construite à chaque demande de fusion, publiée depuis main.
      # Les adresses viennent des variables du dépôt (Settings → Variables), avec des valeurs par défaut.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/ksp_back-office:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://admin.staging.ksp.bj' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.staging.ksp.bj' }}
            NEXT_PUBLIC_PORTAIL_URL=${{ vars.NEXT_PUBLIC_PORTAIL_URL || 'https://staging.ksp.bj' }}
            NEXT_PUBLIC_SHOP_URL=${{ vars.NEXT_PUBLIC_SHOP_URL || 'https://shop.staging.ksp.bj' }}
            NEXT_PUBLIC_PRINT_URL=${{ vars.NEXT_PUBLIC_PRINT_URL || 'https://print.staging.ksp.bj' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
